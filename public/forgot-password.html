<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n="forgot.title">Lupa Kata Laluan - SMART FUND</title>
  <meta name="description" content="SMART FUND - Lupa kata laluan? Reset kata laluan akaun SMART FUND anda dengan cepat dan mudah." />
  <meta name="keywords" content="lupa kata laluan, reset kata laluan, smart fund, fintech, OJK" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/locale.js"></script>
  <script src="/assets/js/currency.js"></script>
</head>
  <body class="font-jakarta min-h-screen flex items-center justify-center bg-slate-50 p-4 sm:p-6">
  <div id="pageLoader" class="page-loader"><div class="loader-logo mx-auto"></div></div>

  <div class="w-full max-w-md">
    <a href="/" class="flex items-center gap-2.5 justify-center mb-8 group">
      <img src="/assets/img/logo.png" alt="SMART FUND Logo" loading="lazy" width="40" height="40" class="object-contain transition-transform duration-300 animate-float" />
      <span class="text-xl font-extrabold gradient-text">SMART FUND</span>
    </a>

    <div class="bg-white rounded-3xl shadow-xl p-6 sm:p-8 border border-slate-100 hover-lift animate-zoom-in">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-2xl font-extrabold text-slate-900" data-i18n="forgot.title">Lupa Kata Laluan</h2>
          <p class="text-slate-500 text-sm mt-1" data-i18n="forgot.subtitle">Reset kata laluan akun anda</p>
        </div>
        <div class="flex items-center gap-2">
          <button id="darkToggle" class="icon-btn" aria-label="Toggle dark mode">
            <i class="fas fa-moon text-slate-600"></i>
          </button>
          <div class="relative" id="langDropdownFp">
            <button id="langToggleFp" class="icon-btn" aria-label="Bahasa">
              <i class="fas fa-globe text-slate-600"></i>
            </button>
            <div id="langMenuFp" class="hidden absolute right-0 mt-2 w-40 bg-white dark:bg-slate-800 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 py-1">
              <button data-lang="ms" class="lang-option w-full px-4 py-2 text-left text-sm hover:bg-slate-100 dark:hover:bg-slate-700">🇲🇾 Bahasa Malaysia</button>
              <button data-lang="en" class="lang-option w-full px-4 py-2 text-left text-sm hover:bg-slate-100 dark:hover:bg-slate-700">🇬🇧 English</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Step Indicators -->
      <div class="flex items-center justify-center mb-6">
        <div class="flex items-center gap-2">
           <div id="ind1" class="step-indicator active">1</div>
           <div class="step-line inactive" id="line1"></div>
           <div id="ind2" class="step-indicator inactive">2</div>
           <div class="step-line inactive" id="line2"></div>
           <div id="ind3" class="step-indicator inactive">3</div>
        </div>
      </div>

      <!-- Step 1: Input Email/HP -->
      <div id="fpStep1" class="space-y-4">
        <p class="text-sm text-slate-600 text-center mb-4" data-i18n="forgot.desc">Masukkan emel atau nombor HP berdaftar anda untuk menerima kod OTP</p>
        <div>
          <label class="form-label" for="fpEmail" data-i18n="forgot.email">Emel</label>
          <input type="email" id="fpEmail" placeholder="email@example.com" class="form-input" />
        </div>
        <div class="text-center text-slate-400 text-sm">— atau —</div>
        <div>
          <label class="form-label" for="fpPhone" data-i18n="forgot.phone">Nombor HP</label>
          <input type="tel" id="fpPhone" placeholder="08xxxxxxxxxx" class="form-input" />
        </div>
        <button id="fpSendOtpBtn" class="btn btn-primary w-full">
          <span class="btn-text"><i class="fas fa-paper-plane mr-2"></i> <span data-i18n="forgot.sendOtp">Hantar OTP</span></span>
        </button>
      </div>

      <!-- Step 2: Verifikasi OTP -->
      <div id="fpStep2" class="space-y-4 hidden">
        <div class="text-center mb-4">
          <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-3">
            <i class="fas fa-key text-blue-600 text-2xl"></i>
          </div>
          <p class="text-sm text-slate-600" data-i18n="forgot.otpHint">Masukkan kod OTP yang dihantar ke emel/SMS anda</p>
        </div>
        <div>
          <label class="form-label" for="fpOtp" data-i18n="forgot.otp">Kod OTP</label>
          <input type="text" id="fpOtp" maxlength="6" placeholder="123456" class="form-input text-center text-2xl tracking-widest font-bold" />
        </div>
        <div id="fpOtpHint" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm text-amber-700"></div>
        <button id="fpVerifyBtn" class="btn btn-primary w-full">
          <i class="fas fa-check mr-2"></i> <span data-i18n="forgot.verify">Sahkan OTP</span>
        </button>
      </div>

      <!-- Step 3: Password Baru -->
      <div id="fpStep3" class="space-y-4 hidden">
        <div class="text-center mb-4">
          <div class="w-16 h-16 bg-green-100 rounded-2xl flex items-center justify-center mx-auto mb-3">
            <i class="fas fa-lock text-green-600 text-2xl"></i>
          </div>
          <p class="text-sm text-slate-600" data-i18n="forgot.newPasswordHint">Buat kata laluan baru untuk akaun anda</p>
        </div>
        <div>
          <label class="form-label" for="fpNewPassword" data-i18n="forgot.newPassword">Kata Laluan Baru</label>
          <div class="relative">
            <input type="password" id="fpNewPassword" placeholder="Minimum 6 aksara" class="form-input pr-12" />
            <button type="button" id="toggleNewPwd" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400" aria-label="Toggle password visibility"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div>
          <label class="form-label" for="fpConfirmPassword" data-i18n="forgot.confirmPassword">Sahkan Kata Laluan</label>
          <div class="relative">
            <input type="password" id="fpConfirmPassword" placeholder="Ulangi kata laluan" class="form-input pr-12" />
            <button type="button" id="toggleConfirmPwd" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400" aria-label="Toggle password visibility"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <button id="fpResetBtn" class="btn btn-primary w-full">
          <span class="btn-text"><i class="fas fa-save mr-2"></i> <span data-i18n="forgot.reset">Reset Kata Laluan</span></span>
        </button>
      </div>

      <p class="text-center text-slate-600 text-sm mt-6">
        <span data-i18n="forgot.remember">Ingat kata laluan?</span>
        <a href="/login.html" class="text-blue-600 font-bold hover:underline" data-i18n="forgot.login">Log Masuk</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      I18N.init();
      hidePageLoader();

      // Language selector (mobile)
      document.querySelectorAll('.lang-option').forEach((btn) => {
        btn.addEventListener('click', () => {
          const lang = btn.getAttribute('data-lang');
          I18N.setLang(lang);
          window.location.reload();
        });
      });

      const darkToggle = document.getElementById('darkToggle');
      const updateIcon = () => { darkToggle.innerHTML = DarkMode.isDark() ? '<i class="fas fa-sun text-amber-500"></i>' : '<i class="fas fa-moon text-slate-600"></i>'; };
      updateIcon();
      darkToggle.addEventListener('click', () => { DarkMode.toggle(); updateIcon(); });

      const steps = { 1: document.getElementById('fpStep1'), 2: document.getElementById('fpStep2'), 3: document.getElementById('fpStep3') };
      const inds = { 1: document.getElementById('ind1'), 2: document.getElementById('ind2'), 3: document.getElementById('ind3') };
      const lines = { 1: document.getElementById('line1'), 2: document.getElementById('line2') };
      let resetToken = null;
      let resetEmail = null;

      function goStep(s) {
        Object.values(steps).forEach((el) => el.classList.add('hidden'));
        steps[s].classList.remove('hidden');
        [1, 2, 3].forEach((i) => {
          inds[i].classList.remove('active', 'complete', 'inactive');
          inds[i].classList.add(i < s ? 'complete' : i === s ? 'active' : 'inactive');
        });
        [1, 2].forEach((i) => {
          lines[i].classList.remove('step-line-active', 'bg-blue-500', 'bg-slate-200', 'opacity-50');
          lines[i].classList.toggle('active', i < s);
          lines[i].classList.toggle('inactive', i >= s);
        });
      }

      // Toggle passwords
      [['toggleNewPwd', 'fpNewPassword'], ['toggleConfirmPwd', 'fpConfirmPassword']].forEach(([btnId, inputId]) => {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inputId);
        btn.addEventListener('click', () => {
          const isPwd = input.type === 'password';
          input.type = isPwd ? 'text' : 'password';
          btn.innerHTML = isPwd ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
        });
      });

      // Step 1: Send OTP
      const sendOtpBtn = document.getElementById('fpSendOtpBtn');
      sendOtpBtn.addEventListener('click', async () => {
        const email = document.getElementById('fpEmail').value.trim();
        const phone = document.getElementById('fpPhone').value.trim();
        if (!email && !phone) return showToast(I18N.t('val.required'), 'error');

        setBtnLoading(sendOtpBtn, true);
        const res = await api('/auth/forgot-password', { method: 'POST', body: { email, phone } });
        setBtnLoading(sendOtpBtn, false);

        if (res.success) {
          resetEmail = res.debug?.email || email;
          const hint = document.getElementById('fpOtpHint');
          if (res.debug?.otp) {
            hint.classList.remove('hidden');
            hint.innerHTML = `<i class="fas fa-info-circle mr-1"></i> Demo: Kod OTP anda adalah <b>${res.debug.otp}</b>`;
          }
          showToast(I18N.t('notif.otpSent'), 'success');
          goStep(2);
        } else {
          showToast(res.message || I18N.t('notif.otpInvalid'), 'error');
        }
      });

      // Step 2: Verify OTP
      document.getElementById('fpVerifyBtn').addEventListener('click', async () => {
        const otp = document.getElementById('fpOtp').value.trim();
        if (!otp || otp.length !== 6) return showToast(I18N.t('val.otpRequired'), 'error');

        const res = await api('/auth/verify-otp', { method: 'POST', body: { email: resetEmail, otp } });
        if (res.success) {
          resetToken = res.token;
          showToast(I18N.t('notif.otpValid'), 'success');
          goStep(3);
        } else {
          showToast(res.message || I18N.t('notif.otpInvalid'), 'error');
        }
      });

      // Step 3: Reset Password
      const resetBtn = document.getElementById('fpResetBtn');
      resetBtn.addEventListener('click', async () => {
        const newPwd = document.getElementById('fpNewPassword').value;
        const confirmPwd = document.getElementById('fpConfirmPassword').value;
        if (!newPwd || newPwd.length < 6) return showToast(I18N.t('val.passwordMin'), 'error');
        if (newPwd !== confirmPwd) return showToast(I18N.t('val.passwordMatch'), 'error');

        setBtnLoading(resetBtn, true);
        const res = await api('/auth/reset-password', { method: 'POST', body: { token: resetToken, newPassword: newPwd } });
        setBtnLoading(resetBtn, false);

        if (res.success) {
          showToast(I18N.t('notif.resetSuccess'), 'success');
          setTimeout(() => (window.location.href = `${BASE_PATH}/login.html`), 800);
        } else {
          showToast(res.message || I18N.t('notif.resetFailed'), 'error');
        }
      });
    });
  </script>
</body>
</html>
