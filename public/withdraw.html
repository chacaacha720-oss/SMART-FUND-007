<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Penarikan Dana - SMART FUND</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
  <header class="bg-white shadow-sm border-b">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="/dashboard.html" class="text-xl font-bold text-blue-600 flex items-center gap-2">
        <i class="fas fa-arrow-left"></i> Kembali ke Dashboard
      </a>
      <img src="/assets/img/logo.png" alt="SMART FUND" class="h-8" />
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-slate-900 mb-2">Penarikan Dana</h1>
      <p class="text-slate-500">Ajukan penarikan dana ke rekening bank Anda</p>
    </div>

    <!-- Balance Info -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-sm text-slate-500 mb-1">Saldo Tersedia</p>
          <p id="availableBalance" class="text-2xl font-bold text-green-600">Rp0</p>
        </div>
        <div class="text-right">
          <p class="text-sm text-slate-500 mb-1">Limit Penarikan</p>
          <p id="withdrawLimit" class="text-xl font-semibold text-slate-900">Rp0</p>
        </div>
      </div>
    </div>

    <!-- Withdrawal Form -->
    <form id="withdrawalForm" class="space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center gap-2">
          <i class="fas fa-user-circle text-blue-500"></i> Data Diri
        </h2>

        <div class="grid md:grid-cols-2 gap-6">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap <span class="text-red-500">*</span></label>
            <input type="text" id="withdrawName" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none transition-colors" />
            <p class="text-red-500 text-xs mt-1 hidden" id="errName"></p>
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1">ID Member <span class="text-red-500">*</span></label>
            <input type="text" id="withdrawMemberId" required readonly class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 bg-slate-50 focus:border-blue-500 outline-none" />
            <p class="text-red-500 text-xs mt-1 hidden" id="errMemberId"></p>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Email <span class="text-red-500">*</span></label>
            <input type="email" id="withdrawEmail" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none transition-colors" />
            <p class="text-red-500 text-xs mt-1 hidden" id="errEmail"></p>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nomor HP <span class="text-red-500">*</span></label>
            <input type="tel" id="withdrawPhone" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none transition-colors" placeholder="Contoh: 081234567890" />
            <p class="text-red-500 text-xs mt-1 hidden" id="errPhone"></p>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center gap-2">
          <i class="fas fa-university text-blue-500"></i> Informasi Bank
        </h2>

        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nama Bank <span class="text-red-500">*</span></label>
            <select id="withdrawBank" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none bg-white">
              <option value="">Pilih Bank</option>
              <option value="BRI">BRI</option>
              <option value="BNI">BNI</option>
              <option value="Mandiri">Mandiri</option>
              <option value="BCA">BCA</option>
              <option value="BTPN">BTPN</option>
              <option value="BSI">BSI</option>
              <option value="Danamon">Danamon</option>
              <option value="CIMB">CIMB Niaga</option>
              <option value="Maya">Maya</option>
              <option value="OVO">OVO</option>
              <option value="Dana">Dana</option>
            </select>
            <p class="text-red-500 text-xs mt-1 hidden" id="errBank"></p>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">No. Rekening <span class="text-red-500">*</span></label>
            <input type="text" id="withdrawAccount" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none transition-colors" placeholder="Hanya angka" />
            <p class="text-red-500 text-xs mt-1 hidden" id="errAccount"></p>
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1">Nama Pemilik Rekening <span class="text-red-500">*</span></label>
            <input type="text" id="withdrawAccountName" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none transition-colors" />
            <p class="text-red-500 text-xs mt-1 hidden" id="errAccountName"></p>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center gap-2">
          <i class="fas fa-money-bill-wave text-blue-500"></i> Jumlah Penarikan
        </h2>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Jumlah (<span id="currencySymbol">Rp</span>) <span class="text-red-500">*</span></label>
            <input type="number" id="withdrawAmount" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none transition-colors" placeholder="0" min="0" step="1000" />
            <p class="text-red-500 text-xs mt-1 hidden" id="errAmount"></p>
          </div>

          <div class="bg-blue-50 rounded-xl p-4">
            <p class="text-sm text-slate-600">
              <i class="fas fa-info-circle mr-1"></i>
              Minimum penarikan: <span class="font-semibold" id="minWithdrawal">Rp100.000</span>
            </p>
            <p class="text-sm text-slate-600 mt-1">
              <i class="fas fa-shield-alt mr-1"></i>
              Dana akan dikirim ke rekening yang terdaftar setelah diverifikasi oleh admin.
            </p>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Catatan (Opsional)</label>
            <textarea id="withdrawNote" rows="3" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none resize-none" placeholder="Tambahkan catatan khusus (opsional)"></textarea>
            <p class="text-red-500 text-xs mt-1 hidden" id="errNote"></p>
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition-all duration-200 flex items-center justify-center gap-3">
        <i class="fas fa-paper-plane"></i>
        Ajukan Penarikan
      </button>
    </form>
  </main>

  <script src="https://kit.fontawesome.com/2e42b41b9a.js" crossorigin="anonymous"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/currency.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      hidePageLoader();

      const user = await requireUser();
      if (!user) return;
      currentUser = user;

      document.getElementById('withdrawMemberId').value = user.id;
      document.getElementById('withdrawName').value = user.full_name || '';
      document.getElementById('withdrawEmail').value = user.email || '';
      document.getElementById('availableBalance').textContent = formatRupiah(user.balance || 0);
      document.getElementById('withdrawLimit').textContent = formatRupiah(user.loan_limit || 0);
      document.getElementById('currencySymbol').textContent = Currency.symbol();

      const settingsRes = await api('/admin/settings');
      if (settingsRes.success && settingsRes.data) {
        document.getElementById('minWithdrawal').textContent = formatRupiah(parseFloat(settingsRes.data.min_withdrawal) || 100000);
      }
    });

    document.getElementById('withdrawAccount').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });

    document.getElementById('withdrawalForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const originalHtml = btn.innerHTML;

      const amount = parseFloat(document.getElementById('withdrawAmount').value);
      const account = document.getElementById('withdrawAccount').value;

      if (currentUser.balance < amount) {
        showToast('Saldo tidak mencukupi', 'error');
        return;
      }
      if (amount < 100000) {
        showToast('Minimum penarikan Rp100.000', 'error');
        return;
      }
      if (!/^\d+$/.test(account)) {
        showToast('Nomor rekening hanya boleh angka', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Memproses...';

      const res = await api('/withdrawals', {
        method: 'POST',
        body: {
          nama: document.getElementById('withdrawName').value,
          email: document.getElementById('withdrawEmail').value,
          no_hp: document.getElementById('withdrawPhone').value,
          bank: document.getElementById('withdrawBank').value,
          no_rekening: account,
          nama_rekening: document.getElementById('withdrawAccountName').value,
          jumlah: amount,
          catatan: document.getElementById('withdrawNote').value
        }
      });

      btn.disabled = false;
      btn.innerHTML = originalHtml;

      if (res.success) {
        Swal.fire({
          icon: 'success',
          title: 'Berhasil!',
          html: `<p class="text-lg mb-4">Pengajuan penarikan Anda telah dikirim.</p>
                 <p class="mb-2"><strong>ID Penarikan:</strong> ${res.data.withdrawalId}</p>
                 <p class="text-sm text-slate-500">Silakan hubungi admin melalui Telegram untuk verifikasi.</p>`,
          confirmButtonText: 'Buka Telegram',
          preconfirm: () => {
            window.location.href = 'https://t.me/smartfundx_bot?start=withdraw_' + res.data.withdrawalId;
          }
        });
        document.getElementById('withdrawalForm').reset();
      } else {
        showToast(res.message || 'Gagal mengajukan penarikan', 'error');
      }
    });
  </script>
</body>
</html>
